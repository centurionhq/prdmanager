<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
  <style>
    body { margin: 0; background: #E9ECEB; font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; color: #17191C; }
    a { color: #1F4FA0; } a:hover { color: #173C7A; }
    .id { font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: 0; }
    * { box-sizing: border-box; }
    .num { font-variant-numeric: tabular-nums; }
  </style>
</helmet>

<!-- El vacío sin órdenes a 390 px (SDD-086 §D7, FB-148). Igual que en escritorio: sin barra de filtros
     (no hay nada que filtrar) y con la salida donde nacen las órdenes, Construir. El vacío por filtros es
     otro estado: conserva la fila de chips y ofrece «Quitar filtros» (ver Ordenes.dc.html). -->
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; background: #E9ECEB;">

  <header style="flex: none; height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 6px 0 16px; border-bottom: 1px solid #C9CFCD;">
    <h1 style="margin: 0; font-size: 20px; line-height: 1; font-weight: 800; font-stretch: 112%; letter-spacing: -0.01em;">Órdenes de trabajo</h1>
    <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 2px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#17191C" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
    </div>
  </header>

  <main style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 12px; padding: 16px; border-top: 1px solid #C9CFCD;">
    <span class="num" style="font-size: 14px; color: #565D63;">0 órdenes</span>
    <section style="display: flex; flex-direction: column; gap: 12px; padding: 24px; background: #FBFCFB; border: 1px solid #C9CFCD; border-radius: 2px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#565D63" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18l-7 8v6l-4 2v-8z"></path></svg>
      <div style="font-size: 16px; font-weight: 600; line-height: 22px;">Todavía no hay órdenes de trabajo para este proyecto</div>
      <p style="margin: 0; font-size: 14px; line-height: 20px; color: #33383D;">Las órdenes no se crean a mano: se generan del checklist <span class="id" style="color: #17191C;">## Tareas</span> de un blueprint publicado (un SDD o un ADR).</p>
      <div style="height: 44px; display: flex; align-items: center; justify-content: center; margin-top: 4px; background: #FBFCFB; border: 1px solid #C9CFCD; border-radius: 2px; font-size: 14px; font-weight: 600;">Ir a Construir</div>
    </section>
  </main>

  <nav style="flex: none; height: 64px; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); background: #FBFCFB; border-top: 1px solid #C9CFCD;">
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 44px; font-size: 12px; color: #565D63;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#565D63" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20V10l6 4V10l6 4V4h6v16z"></path></svg>
      Planta
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 44px; font-size: 12px; color: #565D63;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#565D63" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="5" r="2"></circle><circle cx="6" cy="19" r="2"></circle><circle cx="18" cy="12" r="2"></circle><path d="M6 7v10"></path><path d="M6 12h10"></path></svg>
      Árbol
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 44px; font-size: 12px; color: #565D63;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#565D63" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6v18h12V7z"></path><path d="M14 3v4h4"></path><path d="M9 13h6"></path><path d="M9 17h6"></path></svg>
      Docs
    </div>
    <div style="position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 44px; font-size: 12px; font-weight: 700; color: #17191C;">
      <span style="position: absolute; top: 0; left: 12px; right: 12px; height: 2px; background: #17191C;"></span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#17191C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="1"></rect><path d="M9 4V3h6v1"></path><path d="M9 11h6"></path><path d="M9 15h6"></path></svg>
      Órdenes
    </div>
    <div style="position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 44px; font-size: 12px; color: #565D63;">
      <span class="num" style="position: absolute; top: 8px; left: 50%; margin-left: 6px; min-width: 16px; height: 16px; padding: 0 4px; display: flex; align-items: center; justify-content: center; background: #F5C400; color: #17191C; font-size: 11px; font-weight: 700; border-radius: 2px;">3</span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#565D63" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4L2 20h20z"></path><path d="M12 10v4"></path><circle cx="12" cy="17.5" r="0.5"></circle></svg>
      Drift
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 44px; font-size: 12px; color: #565D63;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#565D63" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1"></circle><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle></svg>
      Más
    </div>
  </nav>
</div>
</x-dc>
</body>
</html>
