# Monitors the connected GitHub repository (PRD-001 F-03): on every push/PR it type-checks, runs unit tests,
# and reports code state to this project's own prdm SaaS server (SDD-010 "Modo remoto") — this repo's own
# governance moved server-side once it adopted remote mode itself (see the README's "SaaS local" section
# for how `packages/server` is currently reachable). `id-token: write` lets `sync-check` request a real
# GitHub Actions OIDC token; the server verifies it against GitHub's own JWKS before ever trusting a
# `push` to `main` as an official baseline (SDD-010 "Sync de developers y drift", WO-179/181) — a PR or a
# push to any other branch silently earns only preview-mode drift reporting, never baseline trust, exactly
# as the server-side gate itself decides (`packages/server/src/engine/baseline-gate.ts`).
#
# PRD-008 §4.6 (WO-404): this workflow no longer runs anything against Neo4j/Postgres. The suites that
# need them (the `db` Vitest project: `packages/*/tests/{integration,e2e,collab,isolation,learning}`) and
# the Playwright e2e journey moved to the developer's own pre-push hook (SDD-017 §4.4, `scripts/hooks/
# pre-push`), run against local `docker compose --profile test` containers (`npm run test:services`)
# instead of ephemeral CI service containers -- see the README's "Tests y CI" section. This workflow keeps
# only what runs without a database: build, typecheck, the no-DB (`unit-node`/`unit-jsdom`) Vitest
# projects, `npm audit`, and this repo's own governance sync. The former `integration-tests`/`e2e` jobs
# are gone; `sync --check` in remote mode never touched a local Neo4j anyway
# (`packages/cli/src/remote/sync.ts`), so `sync-check` needed no service to begin with.
#
# `PRDM_SERVER`/`PRDM_TOKEN`/`PRDM_PROJECT_ID` are mandatory in CI (`resolveRemoteServerOrigin`/
# `resolveRemoteCredential`/`checkProjectPinMismatch` each abort with a clear error rather than silently
# falling back to a local file/pin that doesn't exist here) — repository secrets, never hardcoded:
# `PRDM_TOKEN` is a `project_ci` token scoped to `governance:read`/`reports:write`/`reports:baseline`
# only, `PRDM_SERVER` is this project's own prdm server origin, and `PRDM_PROJECT_ID` is this project's
# own `graphProjectId` — cross-checked against `.prdm.yaml`'s repo-tracked `project.id` (WO-395) exactly
# like `PRDM_SERVER` is cross-checked against `remote.server`, since a PR that edited only `project.id`
# could otherwise silently retarget this run's report at a different project on the same trusted server.
# The `Refs: WO-xxx` commit-message policy is enforced by the server's own cached policy
# now (SDD-010: "usando la caché de política del servidor"), via each developer's local `prdm hooks
# install` — no separate CI step rebuilds a base-ref policy checker anymore, because the enforcement
# authority no longer lives in this repository's own (PR-editable) code the way WO-024's local-mode
# defense had to guard against.
name: prdm-sync

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write

# One in-flight run per ref: a new push on the same PR cancels whatever was still running for the
# previous one, since only the latest commit's result ever matters there — never for `push` to `main`,
# where every run is a distinct point the server may treat as a baseline.
concurrency:
  group: prdm-sync-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sync-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build

      # `tsc -b` above only type-checks/builds packages/web's server half via project references; this also
      # runs `vite build` so the client bundle itself (PRD-004) is verified to compile in CI.
      - run: npm run build --workspace=@prdm/web

      - run: npm run typecheck

      - run: npm run test:unit

      # Remote mode (SDD-010): reports this push/PR's code state to this project's own prdm server. A real
      # `push` to `main` with `id-token: write` earns baseline trust once the server verifies the attached
      # GitHub Actions OIDC token; anything else (a PR, a push to another branch) is still reported and
      # checked for drift, just never advances the official baseline — see this file's own header comment.
      #
      # WO-395: blocking (`continue-on-error: false`) only on a `push` — never on `pull_request`. A PR
      # that introduces newly-governed code under a still-*open* Work Order can never pass `--check`'s
      # own drift gate on its own: remote mode's `complete_work_order` (WO-186) requires a `commit_sha`
      # already verified `trust: baseline`, which only exists once that very commit has landed on `main`
      # and been reported by a `push` run — so completing the WO is only possible *after* this PR merges.
      # Mirrors the same push-vs-PR asymmetry the server's own baseline gate already uses
      # (`packages/server/src/engine/baseline-gate.ts`: baseline trust only ever comes from a `push`);
      # the drift is still reported and visible either way, just never blocks the PR itself.
      - name: "prdm sync --check (blocking only on push to main)"
        run: node packages/cli/dist/index.js sync --check
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        env:
          PRDM_SERVER: ${{ secrets.PRDM_SERVER }}
          PRDM_TOKEN: ${{ secrets.PRDM_TOKEN }}
          PRDM_PROJECT_ID: ${{ secrets.PRDM_PROJECT_ID }}

  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # `--audit-level=high`: this repository's current `npm audit` (checked when this job was written)
      # reports only moderate-severity, dev-only transitive advisories (`esbuild`'s dev-server request
      # forgery, pulled in through `drizzle-kit`'s own `@esbuild-kit/*` dependency chain — never present in
      # anything this server actually ships or runs in production), fixable only via a breaking
      # `drizzle-kit` downgrade. Failing the build on every low/moderate transitive advisory a dev
      # dependency happens to pull in would make this job noisy without making the shipped product any
      # safer; failing on high/critical keeps it meaningful. Revisit the threshold (or fix the moderate
      # findings directly) if `npm audit`'s own output changes.
      - run: npm audit --audit-level=high
