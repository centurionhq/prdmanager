# Monitors the connected GitHub repository (PRD-001 F-03): on every push/PR it type-checks, runs unit tests,
# enforces the "Refs: WO-xxx" commit policy over the pushed/PR range (WO-020) and runs `prdm sync --check`
# against a disposable Neo4j service, failing when blueprints, work orders or governed code drift out of sync.
#
# Optional repository secret NEO4J_PASSWORD; without it a throwaway password is used for the ephemeral
# service container, which is only reachable from this job's runner and holds no data beyond the CI run.
name: prdm-sync

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sync-check:
    runs-on: ubuntu-latest

    services:
      neo4j:
        image: neo4j:2026.08.1-community
        env:
          NEO4J_AUTH: neo4j/${{ secrets.NEO4J_PASSWORD || 'prdm-ci-ephemeral-neo4j' }}
          NEO4J_PLUGINS: '["apoc"]'
          NEO4J_dbms_security_procedures_allowlist: "apoc.path.*,apoc.coll.*,apoc.meta.*,apoc.version"
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p ${NEO4J_AUTH#neo4j/} 'RETURN 1'"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 30
          --health-start-period 20s

    env:
      NEO4J_URI: neo4j://127.0.0.1:7687
      NEO4J_USERNAME: neo4j
      NEO4J_DATABASE: neo4j
      NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD || 'prdm-ci-ephemeral-neo4j' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run build

      - run: npm run typecheck

      - run: npm run test:unit

      # SDD-002 "Ciclo de vida": every commit touching governed code in the pushed/PR range must carry a valid
      # "Refs: WO-xxx" trailer. A push whose `before` sha is all zeros (new branch) is checked from the default
      # branch instead, since there is no prior sha to diff against.
      - name: "Determine commit range for the Refs: policy check"
        id: range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "range=${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "range=origin/${{ github.event.repository.default_branch }}..${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "range=${{ github.event.before }}..${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - run: node packages/cli/dist/index.js check commits --range "${{ steps.range.outputs.range }}"

      - run: node packages/cli/dist/index.js db migrate

      - run: node packages/cli/dist/index.js sync --check
