name: prdmanager

x-neo4j-common: &neo4j-common
  image: neo4j:2026.08.1-community
  environment:
    NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set in .env}
    NEO4J_PLUGINS: '["apoc"]'
    # Only the APOC procedures the engine and neo4j-mcp use; drops apoc.load.*/apoc.import.* (URL/file access).
    NEO4J_dbms_security_procedures_allowlist: "apoc.path.*,apoc.coll.*,apoc.meta.*,apoc.version"
    NEO4J_dbms_security_allow__csv__import__from__file__urls: "false"
    NEO4J_server_memory_heap_initial__size: 512m
    NEO4J_server_memory_heap_max__size: 1G
    NEO4J_server_memory_pagecache_size: 512m
  healthcheck:
    test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' >/dev/null 2>&1 || exit 1"]
    interval: 5s
    timeout: 10s
    retries: 30
    start_period: 20s
  restart: unless-stopped

x-postgres-common: &postgres-common
  image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
  environment:
    # docker-entrypoint-initdb.d scripts run as this bootstrap superuser (SDD-006 §Aislamiento): it *is* prdm_owner,
    # never a separate throwaway "postgres" account. docker/postgres/init/01-roles.sh creates prdm_app from it.
    POSTGRES_USER: prdm_owner
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    POSTGRES_DB: prdm
    POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD must be set in .env}
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U prdm_owner -d prdm"]
    interval: 5s
    timeout: 5s
    retries: 30
    start_period: 10s
  restart: unless-stopped

services:
  neo4j:
    <<: *neo4j-common
    container_name: prdmanager-neo4j
    # No outbound network: Community edition has no Cypher URL blocklist, so LOAD CSV over http is blocked at the network level.
    networks: [neo4j-internal]
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - neo4j-plugins:/plugins

  neo4j-proxy:
    image: alpine/socat:1.8.0.3
    container_name: prdmanager-neo4j-proxy
    depends_on:
      neo4j:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: ["socat TCP-LISTEN:7687,fork,reuseaddr TCP:neo4j:7687 & exec socat TCP-LISTEN:7474,fork,reuseaddr TCP:neo4j:7474"]
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    networks: [neo4j-internal, edge]
    restart: unless-stopped

  neo4j-test:
    <<: *neo4j-common
    container_name: prdmanager-neo4j-test
    profiles: ["test"]
    restart: "no"
    ports:
      - "127.0.0.1:7688:7687"
    tmpfs:
      - /data

  postgres:
    <<: *postgres-common
    container_name: prdmanager-postgres
    ports:
      - "127.0.0.1:${PRDM_POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      # postgres:18+ stores PGDATA at a major-version-specific path (pg_ctlcluster layout: PGDATA defaults to
      # /var/lib/postgresql/18/docker), so the mount point is the parent directory, not .../data.
      - postgres-data:/var/lib/postgresql

  postgres-test:
    <<: *postgres-common
    container_name: prdmanager-postgres-test
    profiles: ["test"]
    restart: "no"
    ports:
      - "127.0.0.1:${PRDM_POSTGRES_TEST_PORT:-5433}:5432"
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/lib/postgresql

  mailpit:
    image: axllent/mailpit:v1.31.1@sha256:98b916bd3c8d61f7633a52d3ea2f58d00620cb01ca57ab59edde68c347a95365
    container_name: prdmanager-mailpit
    ports:
      - "127.0.0.1:${PRDM_MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${PRDM_MAILPIT_UI_PORT:-8025}:8025"
    restart: unless-stopped

networks:
  neo4j-internal:
    internal: true
  edge: {}

volumes:
  neo4j-data:
  neo4j-logs:
  neo4j-plugins:
  postgres-data:
